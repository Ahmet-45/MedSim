<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth-style.css') }}">
</head>
<body>
  <div class="auth-card">
        <div class="logo-circle"><img src="{{ url_for('static', filename='MedSim_Amblem.png') }}" alt="Logo Yüklenemedi" style="width:400px; height: 400px; border-radius: 50%;"></div>
        <div class="brand-title">MedSim</div>
        <p class="page-subtitle">Poliklinik Simülasyonuna Giriş</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}" role="alert" style="font-size: 0.9rem; padding: 10px;">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="post">
            <div class="form-group">
                <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Şifre" required>
            </div>

            <button type="submit" class="btn-primary">Giriş Yap</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('register') }}">Hesap Oluştur</a>
            <a href="#" style="color: #95a5a6;">Şifremi Unuttum</a>
        </div>
    </div>
</body>
</html>

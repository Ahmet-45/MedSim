<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSim - Hasta Simülasyonu</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="main-card">
        <div class="sidebar">
            <img src="{{ url_for('static', filename='MedSim_Logo.png') }}" alt="MedSim Logo" class="sidebar-logo">
            
            <h4 style="text-align: center; color: #333; margin-bottom: 30px; font-weight: 600;">MedSim</h4>

            <button onclick="yeniHasta()" class="btn-modern">
                <i class="fas fa-user-plus" style="margin-right: 10px;"></i> YENİ HASTA
            </button>
            
            <button onclick="tahlilIste()" class="btn-modern" style="background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); box-shadow: 0 4px 15px rgba(253, 160, 133, 0.3);">
                <i class="fas fa-file-medical" style="margin-right: 10px;"></i> TAHLİL İSTE
            </button>

            <div style="margin-top: auto; text-align: center; color: #999; font-size: 0.8rem;">
                Powered by Gemini 2.0<br>v2.1 Stable
            </div>
        </div>

        <div class="chat-section">
            <div style="padding: 20px 30px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h5 style="margin: 0; font-weight: 600; color: #333;">Poliklinik Simülasyonu</h5>
                    <small style="color: #28a745;"><i class="fas fa-circle" style="font-size: 8px;"></i> Sistem Aktif</small>
                </div>
                <i class="fas fa-stethoscope" style="font-size: 1.5rem; color: #e0e0e0;"></i>
            </div>

            <div id="sohbet-kutusu">
                <div class="mesaj doktor">
                    <i class="fas fa-robot" style="color: #667eea; margin-right: 5px;"></i>
                    <b>Asistan:</b> Hoş geldiniz. Görüşmeye başlamak için "Yeni Hasta" butonuna basınız.
                </div>
            </div>

            <div style="padding: 20px 30px; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; background: white;">
                <input type="text" id="user-input" placeholder="Hastaya sorunuzu yazın..." onkeypress="handleEnter(event)" 
                       style="flex: 1; padding: 15px; border: 2px solid #f0f0f0; border-radius: 16px; outline: none; transition: 0.3s;">
                
                <button onclick="sendMessage()" class="btn-modern" style="width: 60px; margin: 0; border-radius: 16px;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Mesaj gelince aşağı kaydır
        function scrollToBottom() {
            const chatBox = document.getElementById("sohbet-kutusu");
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function yeniHasta() {
            document.getElementById("user-input").value = "Yeni Hasta Getir";
            sendMessage();
        }

        async function tahlilIste() {
            document.getElementById("user-input").value = "Kan tahlili istiyorum";
            sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("sohbet-kutusu");
            const message = inputField.value.trim();

            if (message === "") return;

            // 1. KULLANICI MESAJINI EKLE (Senin CSS class'ın: .mesaj .kullanici)
            chatBox.innerHTML += `
                <div class="mesaj kullanici">
                    ${message}
                </div>`;
            
            inputField.value = "";
            scrollToBottom();

            try {
                // 2. Python'a Gönder
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                // 3. HASTA CEVABINI EKLE (Senin CSS class'ın: .mesaj .doktor)
                if (data.response) {
                    chatBox.innerHTML += `
                        <div class="mesaj doktor">
                            <b>Hasta:</b> ${data.response}
                        </div>`;
                }

                // 4. TABLO VARSA EKLE
                if (data.table_html) {
                    // Python'dan gelen basit tabloyu, senin CSS'indeki "custom-table" sınıfıyla değiştiriyoruz ki güzel görünsün
                    let guzelTablo = data.table_html.replace('class="table', 'class="table custom-table');
                    
                    chatBox.innerHTML += `
                        <div class="mesaj doktor" style="width: 95%; max-width: 95%;">
                            <div class="table-responsive">
                                ${guzelTablo}
                            </div>
                        </div>`;
                }

                scrollToBottom();

            } catch (error) {
                console.error("Hata:", error);
                chatBox.innerHTML += `<div class="mesaj doktor" style="color:red;">Bağlantı Hatası!</div>`;
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSim - Doktor Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container-fluid h-100 d-flex justify-content-center align-items-center">
        
        <div class="main-card shadow-lg">
            
            <div class="sidebar d-flex flex-column align-items-center p-4">
                
                <div class="logo-container mb-5 text-center">
                    <img src="{{ url_for('static', filename='MedSim_Logo.png') }}" alt="MedSim Logo" class="img-fluid sidebar-logo">
                </div>

                <button onclick="hazirMesajGonder('Yeni Hasta Tahlili Getir')" class="btn btn-modern w-100 py-3 mb-3">
                    <div class="d-flex align-items-center justify-content-center gap-2">
                        <i class="fa-solid fa-file-medical fa-lg"></i>
                        <span>Yeni Vaka İste</span>
                    </div>
                </button>
                
                </div>

            <div class="chat-section d-flex flex-column">
                
                <div class="chat-header p-3 border-bottom d-flex align-items-center bg-white">
                    <div>
                        <h6 class="mb-0 fw-bold text-dark" style="font-size: 1.1rem;">Poliklinik Ekranı</h6>
                        <small class="text-muted">MedSim Asistanı Aktif</small>
                    </div>
                </div>

                <div id="sohbet-kutusu" class="flex-grow-1 p-4 overflow-auto">
                    <div class="mesaj sistem text-center my-3">
                        <span class="badge bg-secondary opacity-50 fw-light px-3 py-2">Sistem Hazır. Yeni vaka isteyebilirsiniz.</span>
                    </div>
                </div>

                <div class="chat-input p-3 border-top bg-white">
                    <div class="input-group">
                        <input type="text" id="mesaj-input" class="form-control border-0 bg-light shadow-sm" placeholder="Komut yazın..." autocomplete="off" style="border-radius: 20px 0 0 20px; padding-left: 20px;">
                        <button class="btn btn-primary shadow-sm" style="border-radius: 0 20px 20px 0; padding-right: 20px;" type="button" id="gonder-btn">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
